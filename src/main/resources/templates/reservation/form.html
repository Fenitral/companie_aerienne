<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nouvelle réservation</title>
    <link rel="stylesheet" href="/static/css/style.css">
<style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--light-blue);
            color: var(--dark-blue);
            margin: 0;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: var(--primary-blue);
        }
        form {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: beige;
        }
    </style>
</head>
<body>
    <h2>Nouvelle réservation</h2>

    <form action="#" th:action="@{/reservations/nouvelle}" th:object="${reservation}" method="post">
        <label for="client">Client :</label>
        <select id="client" name="client.id" required>
            <option th:each="c : ${clients}" th:value="${c.id}" th:text="${c.nom}"></option>
        </select>
        <br/><br/>

        <label for="vol">Vol disponible :</label>
        <select id="vol" name="volProgramme.id" required>
            <option th:each="v : ${vols}" 
                    th:value="${v.id}" 
                    th:text="${v.vol.villeDepart.nom} + ' -> ' + ${v.vol.villeArrivee.nom} + ' le ' + ${#temporals.format(v.dateHeureDepart,'dd/MM/yyyy HH:mm')}">
            </option>

        </select>
        <br/><br/>

        <label for="classe">Classe :</label>
        <select id="classe" name="classe.id" required>
            <option th:each="cl : ${classes}" th:value="${cl.id}" th:text="${cl.libelle}"></option>
        </select>
        <br/><br/>

        <label for="nbPlaces">Nombre de places :</label>
        <input type="number" id="nbPlaces" name="nbPlaces" min="1" required>
        <br/><br/>

        <button type="submit">Valider</button>
    </form>

</body>
</html>
